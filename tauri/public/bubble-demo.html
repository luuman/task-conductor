<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssistantBubble 当前 vs 优化方案</title>
<script src="demo-data.js"></script>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --border: rgba(255,255,255,0.08);
    --fg: #d4d4d4;
    --fg2: #8b949e;
    --accent: #007acc;
    --green: #56d364;
    --red: #f85149;
    --yellow: #eab308;
    --font: -apple-system, system-ui, 'Segoe UI', sans-serif;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: var(--fg); font-family: var(--font); font-size: 13px; }

  /* ── Page layout ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    padding: 12px 24px;
    background: rgba(17,17,17,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
  }
  .header h1 { font-size: 15px; font-weight: 700; }
  .header .sub { font-size: 11px; color: var(--fg2); }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    height: calc(100vh - 48px);
  }
  .col {
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--bg);
  }
  .col:last-child { border-right: none; }
  .col-header {
    position: sticky; top: 0; z-index: 10;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .col-badge {
    font-size: 9px; font-weight: 700; padding: 2px 8px;
    border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge-old { background: rgba(139,148,158,0.15); color: var(--fg2); }
  .badge-new { background: rgba(0,122,204,0.15); color: var(--accent); }
  .col-title { font-size: 12px; font-weight: 600; }
  .col-desc { font-size: 10px; color: var(--fg2); margin-left: auto; }
  .col-body { padding: 8px 0; }

  /* ── Shared ── */
  .msg-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 16px;
  }
  .avatar {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; margin-top: 2px;
    background: rgba(0,122,204,0.08);
    border: 1px solid rgba(0,122,204,0.15);
    color: var(--accent);
  }
  .bubble-wrap { min-width: 0; flex: 1; }

  /* ══════════════════════════════════════
     CURRENT — mirrors real component
     ══════════════════════════════════════ */
  .cur-bubble {
    border-radius: 8px; padding: 10px 14px;
    background: rgba(68,119,255,0.04);
    border: 1px solid rgba(68,119,255,0.12);
    max-width: 92%;
  }
  .cur-text { font-size: 12.5px; line-height: 1.6; margin-bottom: 4px; }
  .cur-text:last-child { margin-bottom: 0; }
  .cur-text code {
    font-size: 11px; font-family: var(--mono);
    padding: 1px 4px; border-radius: 3px;
    background: var(--panel); color: var(--accent);
  }
  /* Tool widget (current) */
  .cur-tool { margin: 4px 0; }
  .cur-tool-header {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; cursor: pointer;
  }
  .cur-tool-header:hover { opacity: 0.8; }
  .cur-tool-icon {
    flex-shrink: 0; color: var(--fg2); font-size: 14px;
    width: 16px; text-align: center;
  }
  .cur-tool-name {
    font-size: 11.5px; font-weight: 600; color: var(--fg); flex-shrink: 0;
  }
  .cur-tool-param {
    font-size: 10.5px; font-family: var(--mono);
    color: var(--fg2); background: var(--bg);
    padding: 2px 6px; border-radius: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 280px;
  }
  .cur-tool-edit-info {
    font-size: 10px; font-family: var(--mono);
    color: var(--fg2); margin-left: 4px;
  }
  .cur-tool-preview {
    font-size: 10px; font-family: var(--mono);
    color: var(--fg2); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 160px;
  }
  .cur-tool-chevron {
    color: var(--fg2); font-size: 10px; margin-left: auto;
    transition: transform 0.15s;
  }
  .cur-tool-error {
    font-size: 9px; font-family: var(--mono);
    padding: 1px 6px; border-radius: 4px;
    color: var(--red); background: rgba(244,63,94,0.1);
  }
  /* Tool body (expanded) */
  .cur-tool-body { padding: 4px 0; }
  .cur-diff {
    border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); margin-top: 4px;
  }
  .cur-diff-header {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 10px; font-family: var(--mono); color: var(--fg2);
  }
  .cur-diff-body {
    font-size: 10px; font-family: var(--mono);
    line-height: 1.6; background: var(--bg);
    padding: 4px 0; max-height: 150px; overflow-y: auto;
  }
  .cur-diff-line { padding: 0 10px; white-space: pre-wrap; word-break: break-all; }
  .cur-diff-del { background: rgba(244,63,94,0.07); color: #fda4af; }
  .cur-diff-add { background: rgba(34,197,94,0.07); color: #86efac; }
  .cur-diff-ctx { color: var(--fg2); opacity: 0.5; }
  /* Bash output */
  .cur-bash {
    border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); margin-top: 4px;
  }
  .cur-bash-header {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .cur-bash-prompt {
    font-size: 10px; font-family: var(--mono);
    font-weight: 700; color: var(--accent);
  }
  .cur-bash-cmd {
    font-size: 10px; font-family: var(--mono);
    color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cur-bash-output {
    padding: 4px 10px; font-size: 10px; font-family: var(--mono);
    white-space: pre-wrap; color: var(--fg2);
    max-height: 80px; overflow-y: auto;
    background: var(--bg);
  }
  /* Read group pills (current) */
  .cur-read-group { margin: 4px 0; }
  .cur-read-header {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 0; cursor: pointer;
  }
  .cur-pill {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px; border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 10px; font-family: var(--mono); color: var(--fg2);
  }
  .cur-pill-icon { font-size: 10px; }
  /* Read file result */
  .cur-read-result {
    border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); margin-top: 4px;
  }
  .cur-read-header2 {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 10px; font-family: var(--mono); color: var(--fg2);
  }
  .cur-read-body {
    padding: 4px 10px; font-size: 10px; font-family: var(--mono);
    white-space: pre; color: var(--fg2); overflow-x: auto;
    max-height: 100px; overflow-y: auto; line-height: 1.6;
    background: var(--bg);
  }

  /* ══════════════════════════════════════
     NEW — 极简紧凑 + Edit 代码展示
     ══════════════════════════════════════ */
  .new-bubble {
    border-radius: 8px; padding: 10px 14px;
    background: rgba(68,119,255,0.04);
    border: 1px solid rgba(68,119,255,0.12);
    max-width: 92%;
  }
  .new-text { font-size: 12.5px; line-height: 1.6; margin-bottom: 4px; }
  .new-text:last-child { margin-bottom: 0; }
  .new-text code {
    font-size: 11px; font-family: var(--mono);
    padding: 1px 4px; border-radius: 3px;
    background: var(--panel); color: var(--accent);
  }

  /* Compact tool line */
  .new-tool-line {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 0 3px 8px;
    margin: 1px 0;
    border-left: 2px solid rgba(255,255,255,0.06);
    font-size: 11px; color: var(--fg2);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .new-tool-line:hover { border-left-color: var(--accent); }
  .new-tool-icon { flex-shrink: 0; font-size: 12px; width: 14px; text-align: center; }
  .new-tool-file {
    font-family: var(--mono); font-size: 10.5px;
    color: var(--accent); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .new-tool-cmd {
    font-family: var(--mono); font-size: 10.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 280px;
  }
  .new-badge {
    font-size: 9px; font-family: var(--mono);
    padding: 1px 5px; border-radius: 3px; flex-shrink: 0;
    margin-left: auto;
  }
  .new-badge-edit { background: rgba(86,211,100,0.1); color: var(--green); }
  .new-badge-err { background: rgba(244,63,94,0.1); color: var(--red); }
  .new-badge-ok { background: rgba(86,211,100,0.1); color: var(--green); }
  .new-err-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--red); flex-shrink: 0;
  }

  /* Read summary line */
  .new-read-summary {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 0 3px 8px;
    margin: 1px 0;
    border-left: 2px solid rgba(255,255,255,0.06);
    font-size: 10.5px; font-family: var(--mono); color: var(--fg2);
  }

  /* Edit inline diff (compact) */
  .new-diff {
    margin: 2px 0 2px 10px;
    border-radius: 4px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
    max-height: 120px; overflow-y: auto;
  }
  .new-diff-line {
    padding: 0 8px;
    font-size: 10px; font-family: var(--mono);
    line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
  }
  .new-diff-del { background: rgba(244,63,94,0.06); color: #fda4af; }
  .new-diff-add { background: rgba(34,197,94,0.06); color: #86efac; }

  /* Bash inline result */
  .new-bash-result {
    margin: 1px 0 1px 10px;
    padding: 3px 8px;
    font-size: 10px; font-family: var(--mono);
    color: var(--fg2); background: rgba(255,255,255,0.02);
    border-radius: 4px;
    max-height: 60px; overflow-y: auto;
    white-space: pre-wrap;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div class="header">
  <h1>AssistantBubble 对比</h1>
  <span class="sub">左：当前效果 — 右：极简紧凑优化（Edit 代码可见）— 数据来自真实 session</span>
</div>

<div class="columns">
  <!-- Left: Current -->
  <div class="col">
    <div class="col-header">
      <span class="col-badge badge-old">CURRENT</span>
      <span class="col-title">当前效果</span>
      <span class="col-desc">每条消息独立 bubble，工具展示完整</span>
    </div>
    <div class="col-body" id="current-col"></div>
  </div>
  <!-- Right: New -->
  <div class="col">
    <div class="col-header">
      <span class="col-badge badge-new">NEW</span>
      <span class="col-title">极简紧凑</span>
      <span class="col-desc">隐藏噪音，工具缩行，Edit 展示代码</span>
    </div>
    <div class="col-body" id="new-col"></div>
  </div>
</div>

<script>
// ── Helper ──
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fileName(fp) {
  if (!fp) return '';
  return fp.split('/').pop() || fp;
}
function toolIcon(name) {
  const map = {
    'Read': '📄', 'Write': '📝', 'Edit': '✏️', 'Bash': '⚡',
    'Grep': '🔍', 'Glob': '📂', 'Agent': '🤖', 'Skill': '🎯',
    'ToolSearch': '🔧', 'MultiEdit': '✏️',
  };
  return map[name] || '🔧';
}
function editStats(old_s, new_s) {
  const oldN = old_s ? old_s.split('\n').length : 0;
  const newN = new_s ? new_s.split('\n').length : 0;
  const parts = [];
  if (newN > 0) parts.push('+' + newN);
  if (oldN > 0) parts.push('−' + oldN);
  return parts.join(' ');
}
function inlineCode(text) {
  if (!text) return '';
  return text.replace(/`([^`]+)`/g, '<code>$1</code>');
}

// ══════════════════════════════════════
// CURRENT renderer
// ══════════════════════════════════════
function renderCurrent(data) {
  let html = '';
  // Group consecutive assistant messages into "turns"
  // In current component, each message is a separate bubble
  for (const m of data) {
    if (m.role === 'user') continue; // skip user for this demo
    html += '<div class="msg-row">';
    html += '<div class="avatar">C</div>';
    html += '<div class="bubble-wrap">';
    html += '<div class="cur-bubble">';

    if (m.type === 'text' && m.text) {
      html += '<div class="cur-text">' + inlineCode(esc(m.text)) + '</div>';
    } else if (m.type === 'tool_use') {
      const tn = m.tool_name || 'Tool';
      const isEdit = tn === 'Edit' || tn === 'MultiEdit';
      const isRead = tn === 'Read';
      const isBash = tn === 'Bash';
      const fp = m.file_path;

      html += '<div class="cur-tool">';
      html += '<div class="cur-tool-header" onclick="this.nextElementSibling&&this.nextElementSibling.classList.toggle(\'hidden\')">';
      html += '<span class="cur-tool-icon">' + toolIcon(tn) + '</span>';

      if (fp) {
        html += '<span class="cur-tool-param">' + esc(fileName(fp));
        if (isEdit && m.old_string) {
          html += '<span class="cur-tool-edit-info">' + editStats(m.old_string, m.new_string) + '</span>';
        }
        html += '</span>';
      } else if (isBash && m.command) {
        html += '<span class="cur-tool-name">' + tn + '</span>';
        html += '<code class="cur-tool-param">' + esc(m.command) + '</code>';
      } else {
        html += '<span class="cur-tool-name">' + tn + '</span>';
      }

      if (m.tool_error) html += '<span class="cur-tool-error">ERROR</span>';
      html += '<span style="flex:1"></span>';
      if (m.tool_result && !isEdit) {
        html += '<span class="cur-tool-preview">' + esc(m.tool_result.split('\n')[0].slice(0, 60)) + '</span>';
      }
      html += '<span class="cur-tool-chevron">▸</span>';
      html += '</div>'; // header

      // Body (collapsed by default, click to toggle)
      html += '<div class="cur-tool-body hidden">';
      if (isEdit && m.old_string) {
        html += '<div class="cur-diff">';
        html += '<div class="cur-diff-header">' + esc(fp) + '</div>';
        html += '<div class="cur-diff-body">';
        for (const line of (m.old_string || '').split('\n')) {
          html += '<div class="cur-diff-line cur-diff-del">- ' + esc(line) + '</div>';
        }
        for (const line of (m.new_string || '').split('\n')) {
          html += '<div class="cur-diff-line cur-diff-add">+ ' + esc(line) + '</div>';
        }
        html += '</div></div>';
      }
      if (isBash && m.tool_result) {
        html += '<div class="cur-bash">';
        html += '<div class="cur-bash-header"><span class="cur-bash-prompt">$</span><span class="cur-bash-cmd">' + esc(m.command) + '</span></div>';
        html += '<div class="cur-bash-output">' + esc(m.tool_result) + '</div>';
        html += '</div>';
      }
      if (isRead && m.tool_result) {
        html += '<div class="cur-read-result">';
        html += '<div class="cur-read-header2">' + esc(fp) + '</div>';
        html += '<div class="cur-read-body">' + esc(m.tool_result) + '</div>';
        html += '</div>';
      }
      html += '</div>'; // body
      html += '</div>'; // tool
    }

    html += '</div></div></div>'; // bubble, wrap, row
  }
  return html;
}

// ══════════════════════════════════════
// NEW renderer — 极简紧凑 + Edit 代码展示
// ══════════════════════════════════════
function renderNew(data) {
  let html = '';
  // Group consecutive assistant messages into turns (text separates turns)
  let currentTurn = [];
  const turns = [];

  for (const m of data) {
    if (m.role === 'user') {
      if (currentTurn.length) { turns.push(currentTurn); currentTurn = []; }
      continue;
    }
    currentTurn.push(m);
    // Text messages create natural breaks — but keep in same turn
  }
  if (currentTurn.length) turns.push(currentTurn);

  for (const turn of turns) {
    html += '<div class="msg-row">';
    html += '<div class="avatar">C</div>';
    html += '<div class="bubble-wrap"><div class="new-bubble">';

    // Group reads together
    let readBuf = [];
    const flushReads = () => {
      if (readBuf.length === 0) return;
      if (readBuf.length === 1) {
        const r = readBuf[0];
        html += '<div class="new-tool-line">';
        html += '<span class="new-tool-icon">📄</span>';
        html += '<span class="new-tool-file">' + esc(fileName(r.file_path)) + '</span>';
        html += '</div>';
      } else {
        const names = readBuf.map(r => fileName(r.file_path)).join(', ');
        html += '<div class="new-read-summary">';
        html += '📖 读取 ' + readBuf.length + ' 个文件: ' + esc(names);
        html += '</div>';
      }
      readBuf = [];
    };

    for (const m of turn) {
      if (m.type === 'text' && m.text) {
        flushReads();
        html += '<div class="new-text">' + inlineCode(esc(m.text)) + '</div>';
        continue;
      }

      const tn = m.tool_name || '';
      const isEdit = tn === 'Edit' || tn === 'MultiEdit';
      const isBash = tn === 'Bash';
      const isRead = tn === 'Read';

      if (isRead) {
        readBuf.push(m);
        continue;
      }

      flushReads();

      if (isEdit) {
        // Compact line + inline diff
        html += '<div class="new-tool-line">';
        html += '<span class="new-tool-icon">✏️</span>';
        html += '<span class="new-tool-file">' + esc(fileName(m.file_path)) + '</span>';
        html += '<span class="new-badge new-badge-edit">' + editStats(m.old_string, m.new_string) + '</span>';
        html += '</div>';
        // Show diff inline
        if (m.old_string || m.new_string) {
          html += '<div class="new-diff">';
          for (const line of (m.old_string || '').split('\n')) {
            if (line.trim()) html += '<div class="new-diff-line new-diff-del">- ' + esc(line) + '</div>';
          }
          for (const line of (m.new_string || '').split('\n')) {
            if (line.trim()) html += '<div class="new-diff-line new-diff-add">+ ' + esc(line) + '</div>';
          }
          html += '</div>';
        }
      } else if (isBash) {
        html += '<div class="new-tool-line">';
        html += '<span class="new-tool-icon">⚡</span>';
        html += '<span class="new-tool-cmd">' + esc(m.command) + '</span>';
        if (m.tool_error) {
          html += '<span class="new-err-dot"></span>';
        } else if (m.tool_result) {
          const firstLine = m.tool_result.split('\n')[0].trim();
          if (firstLine.toLowerCase().includes('error') || firstLine.toLowerCase().includes('fail')) {
            html += '<span class="new-badge new-badge-err">fail</span>';
          }
        }
        html += '</div>';
        // Show short result inline
        if (m.tool_result && m.tool_result.trim()) {
          html += '<div class="new-bash-result">' + esc(m.tool_result.trim().slice(0, 200)) + '</div>';
        }
      } else {
        // Other tools: single line
        html += '<div class="new-tool-line">';
        html += '<span class="new-tool-icon">' + toolIcon(tn) + '</span>';
        if (m.file_path) {
          html += '<span class="new-tool-file">' + esc(fileName(m.file_path)) + '</span>';
        } else {
          html += '<span class="new-tool-cmd">' + esc(tn) + '</span>';
        }
        html += '</div>';
      }
    }
    flushReads();

    html += '</div></div></div>'; // bubble, wrap, row
  }
  return html;
}

// ── Toggle hidden ──
document.addEventListener('click', e => {
  // for .hidden toggle
});

// ── Render ──
document.getElementById('current-col').innerHTML = renderCurrent(DEMO_DATA);
document.getElementById('new-col').innerHTML = renderNew(DEMO_DATA);

// Style for hidden
const style = document.createElement('style');
style.textContent = '.hidden { display: none !important; }';
document.head.appendChild(style);
</script>
</body>
</html>
