<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssistantBubble 方案 C 智能分区 — 真实数据对比</title>
<script src="demo-data.js"></script>
<style>
  :root {
    --bg: #1e1e1e;
    --bg2: #181818;
    --panel: #252526;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.04);
    --fg: #d4d4d4;
    --fg2: #8b949e;
    --fg3: #6e7681;
    --accent: #007acc;
    --accent2: rgba(0,122,204,0.12);
    --green: #56d364;
    --green-bg: rgba(86,211,100,0.06);
    --red: #f85149;
    --red-bg: rgba(248,81,73,0.06);
    --yellow: #eab308;
    --font: 'Geist', -apple-system, system-ui, sans-serif;
    --mono: 'Geist Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: var(--fg); font-family: var(--font); font-size: 13px; }

  /* ── Page ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    padding: 10px 24px;
    background: rgba(17,17,17,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .header h1 { font-size: 14px; font-weight: 700; }
  .header .sub { font-size: 11px; color: var(--fg2); }
  .header .badge {
    font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge-c { background: rgba(86,211,100,0.15); color: var(--green); }

  .columns {
    display: grid; grid-template-columns: 1fr 1fr;
    height: calc(100vh - 40px);
  }
  .col {
    overflow-y: auto; background: var(--bg);
    border-right: 1px solid var(--border);
  }
  .col:last-child { border-right: none; }
  .col-head {
    position: sticky; top: 0; z-index: 10;
    padding: 8px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    font-size: 11px;
  }
  .col-badge {
    font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .col-badge-old { background: rgba(139,148,158,0.12); color: var(--fg2); }
  .col-badge-new { background: rgba(0,122,204,0.15); color: var(--accent); }
  .col-title { font-weight: 600; }
  .col-desc { color: var(--fg3); margin-left: auto; font-size: 10px; }
  .col-body { padding: 4px 0; }

  /* ── Shared ── */
  .msg-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 5px 14px;
  }
  .avatar {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; margin-top: 2px;
    color: var(--accent);
    background: rgba(0,122,204,0.06); border: 1px solid rgba(0,122,204,0.12);
  }
  .wrap { min-width: 0; flex: 1; }

  /* ══════════════════════════════════════════
     CURRENT — 每条消息独立 bubble
     ══════════════════════════════════════════ */
  .cur-bub {
    border-radius: 8px; padding: 8px 12px; margin-bottom: 2px;
    background: rgba(68,119,255,0.03); border: 1px solid rgba(68,119,255,0.08);
    max-width: 95%;
  }
  .cur-text { font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
  .cur-text code {
    font-size: 10.5px; font-family: var(--mono);
    padding: 1px 4px; border-radius: 3px;
    background: rgba(255,255,255,0.06); color: var(--accent);
  }
  /* Tool header (current) */
  .cur-th {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 0; cursor: pointer;
  }
  .cur-th:hover { opacity: 0.8; }
  .cur-ti { flex-shrink: 0; font-size: 12px; width: 16px; text-align: center; color: var(--fg2); }
  .cur-tn { font-size: 10.5px; font-weight: 600; color: var(--fg); flex-shrink: 0; }
  .cur-tp {
    font-size: 10px; font-family: var(--mono); color: var(--fg2);
    background: rgba(255,255,255,0.04); padding: 1px 5px; border-radius: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px;
  }
  .cur-ei { font-size: 9px; font-family: var(--mono); color: var(--fg3); margin-left: 2px; }
  .cur-err {
    font-size: 8px; font-family: var(--mono); font-weight: 700;
    padding: 1px 5px; border-radius: 3px;
    color: var(--red); background: var(--red-bg);
  }
  .cur-pv {
    font-size: 9px; font-family: var(--mono); color: var(--fg3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;
  }
  .cur-ch { color: var(--fg3); font-size: 9px; margin-left: auto; }
  .flex1 { flex: 1; }

  /* Expandable body */
  .cur-body { overflow: hidden; }
  .cur-diff {
    border-radius: 6px; overflow: hidden; margin-top: 3px;
    border: 1px solid var(--border);
  }
  .cur-diff-head {
    padding: 3px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
    font-size: 9.5px; font-family: var(--mono); color: var(--fg3);
  }
  .cur-diff-body {
    font-size: 9.5px; font-family: var(--mono); line-height: 1.55;
    max-height: 140px; overflow-y: auto; background: var(--bg2);
  }
  .cur-dl { padding: 0 8px; white-space: pre-wrap; word-break: break-all; }
  .cur-dd { background: var(--red-bg); color: #fda4af; }
  .cur-da { background: var(--green-bg); color: #86efac; }
  .cur-bash {
    border-radius: 6px; overflow: hidden; margin-top: 3px;
    border: 1px solid var(--border);
  }
  .cur-bash-h {
    padding: 3px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 4px;
  }
  .cur-bash-p { font-size: 10px; font-family: var(--mono); font-weight: 700; color: var(--accent); }
  .cur-bash-c { font-size: 9.5px; font-family: var(--mono); color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cur-bash-o {
    padding: 3px 8px; font-size: 9.5px; font-family: var(--mono);
    white-space: pre-wrap; color: var(--fg3); max-height: 60px; overflow-y: auto;
    background: var(--bg2);
  }

  /* ══════════════════════════════════════════
     方案 C — 智能分区
     ══════════════════════════════════════════ */
  .c-bub {
    border-radius: 8px; padding: 10px 14px; margin-bottom: 2px;
    background: rgba(68,119,255,0.03); border: 1px solid rgba(68,119,255,0.08);
    max-width: 95%;
  }
  .c-text { font-size: 12px; line-height: 1.6; white-space: pre-wrap; margin: 3px 0; }
  .c-text:first-child { margin-top: 0; }
  .c-text:last-child { margin-bottom: 0; }
  .c-text code {
    font-size: 10.5px; font-family: var(--mono);
    padding: 1px 4px; border-radius: 3px;
    background: rgba(255,255,255,0.06); color: var(--accent);
  }

  /* ── 只读工具 pill 行 ── */
  .c-read-row {
    display: flex; align-items: center; gap: 0;
    flex-wrap: wrap;
    margin: 4px 0;
  }
  .c-read-label {
    font-size: 10px; color: var(--fg3); margin-right: 6px;
    font-weight: 600; flex-shrink: 0;
  }
  .c-pill {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 8px; margin: 1px 3px 1px 0;
    border-radius: 10px; font-size: 10px; font-family: var(--mono);
    color: var(--fg2);
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: border-color 0.15s;
  }
  .c-pill:hover { border-color: var(--accent2); }
  .c-pill-icon { font-size: 9px; flex-shrink: 0; }
  /* Grep pill has search icon */
  .c-pill-grep { border-left: 2px solid rgba(0,122,204,0.3); }

  /* ── 写操作：Edit（内联 diff） ── */
  .c-edit {
    margin: 5px 0;
    border-radius: 6px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .c-edit-head {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .c-edit-icon { font-size: 11px; color: var(--fg2); flex-shrink: 0; }
  .c-edit-file {
    font-size: 10.5px; font-family: var(--mono); font-weight: 600;
    color: var(--accent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .c-edit-stat {
    margin-left: auto; font-size: 9px; font-family: var(--mono);
    padding: 1px 6px; border-radius: 3px; flex-shrink: 0;
    background: var(--green-bg); color: var(--green);
  }
  .c-edit-diff {
    font-size: 9.5px; font-family: var(--mono); line-height: 1.55;
    max-height: 130px; overflow-y: auto;
  }
  .c-dl { padding: 0 10px; white-space: pre-wrap; word-break: break-all; }
  .c-dd { background: var(--red-bg); color: #fda4af; }
  .c-da { background: var(--green-bg); color: #86efac; }

  /* ── 验证操作：Bash（终端卡片） ── */
  .c-bash-card {
    margin: 5px 0; border-radius: 6px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.2);
  }
  .c-bash-header {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .c-bash-header-err { border-left: 2px solid rgba(248,81,73,0.4); }
  .c-bash-icon { flex-shrink: 0; color: var(--fg3); display: flex; align-items: center; }
  .c-bash-prompt { font-size: 11px; font-family: var(--mono); font-weight: 700; color: var(--green); flex-shrink: 0; }
  .c-bash-cmd {
    font-size: 10.5px; font-family: var(--mono); color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; min-width: 0;
  }
  .c-bash-badge {
    margin-left: auto; font-size: 9px; font-weight: 600;
    padding: 2px 8px; border-radius: 4px; flex-shrink: 0; letter-spacing: 0.3px;
  }
  .c-bash-pass { background: rgba(86,211,100,0.1); color: var(--green); }
  .c-bash-fail { background: rgba(248,81,73,0.1); color: var(--red); }
  .c-bash-output {
    padding: 6px 10px; font-size: 10px; font-family: var(--mono); line-height: 1.5;
    color: var(--fg2); background: rgba(0,0,0,0.15);
    max-height: 80px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    border-top: 1px solid rgba(255,255,255,0.03);
  }
  .c-bash-output-err { color: #fda4af; }

  /* ── Other tools ── */
  .c-other {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 0; margin: 1px 0;
    font-size: 10.5px; color: var(--fg3);
  }
  .c-other-icon { font-size: 11px; flex-shrink: 0; }
  .c-other-name { font-weight: 600; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
  .hidden { display: none !important; }

  /* ── Divider between logical turns ── */
  .turn-gap { height: 8px; }
</style>
</head>
<body>

<div class="header">
  <h1>AssistantBubble 对比</h1>
  <span class="badge badge-c">方案 C</span>
  <span class="sub">智能分区 — 只读工具 pill 收纳 · Edit diff 内联 · Bash 状态行 · 真实 session 数据</span>
</div>

<div class="columns">
  <div class="col">
    <div class="col-head">
      <span class="col-badge col-badge-old">CURRENT</span>
      <span class="col-title">当前效果</span>
      <span class="col-desc">每条消息独立 bubble，无分层</span>
    </div>
    <div class="col-body" id="col-cur"></div>
  </div>
  <div class="col">
    <div class="col-head">
      <span class="col-badge col-badge-new">NEW</span>
      <span class="col-title">方案 C · 智能分区</span>
      <span class="col-desc">只读→pill · 写入→diff · 验证→状态行</span>
    </div>
    <div class="col-body" id="col-new"></div>
  </div>
</div>

<script>
const READONLY = new Set(['Read', 'Grep', 'Glob', 'WebSearch', 'WebFetch', 'ToolSearch']);
const WRITE_TOOLS = new Set(['Edit', 'MultiEdit', 'Write']);

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fn(fp) { return fp ? (fp.split('/').pop() || fp) : ''; }
function ic(name) {
  return ({ Read:'📄', Write:'📝', Edit:'✏️', MultiEdit:'✏️', Bash:'⚡', Grep:'🔍', Glob:'📂', Agent:'🤖', Skill:'🎯', ToolSearch:'🔧' })[name] || '🔧';
}
function editStat(o,n) {
  const a = o ? o.split('\n').length : 0;
  const b = n ? n.split('\n').length : 0;
  const p = []; if(b>0) p.push('+'+b); if(a>0) p.push('−'+a); return p.join(' ');
}
function inlineCode(t) { return (t||'').replace(/`([^`]+)`/g, '<code>$1</code>'); }

// ══════════════════════════════════════
// CURRENT: each message = 1 bubble
// ══════════════════════════════════════
function renderCurrent(data) {
  let h = '';
  for (const m of data) {
    if (m.role !== 'assistant') continue;
    h += '<div class="msg-row"><div class="avatar">C</div><div class="wrap"><div class="cur-bub">';

    if (m.type === 'text' && m.text) {
      h += '<div class="cur-text">' + inlineCode(esc(m.text)) + '</div>';
    } else if (m.type === 'tool_use') {
      const tn = m.tool_name || 'Tool';
      const isEdit = WRITE_TOOLS.has(tn);
      const isBash = tn === 'Bash';
      const fp = m.file_path;
      const uid = 'ct_' + Math.random().toString(36).slice(2,8);

      h += '<div class="cur-th" onclick="document.getElementById(\'' + uid + '\')?.classList.toggle(\'hidden\')">';
      h += '<span class="cur-ti">' + ic(tn) + '</span>';
      if (fp) {
        h += '<span class="cur-tn">' + tn + '</span>';
        h += '<span class="cur-tp">' + esc(fn(fp));
        if (isEdit && m.old_string) h += '<span class="cur-ei"> ' + editStat(m.old_string, m.new_string) + '</span>';
        h += '</span>';
      } else if (isBash && m.command) {
        h += '<span class="cur-tn">Bash</span>';
        h += '<span class="cur-tp">' + esc(m.command.slice(0,80)) + '</span>';
      } else {
        h += '<span class="cur-tn">' + esc(tn) + '</span>';
      }
      if (m.tool_error) h += '<span class="cur-err">ERROR</span>';
      h += '<span class="flex1"></span>';
      if (m.tool_result && !isEdit) {
        h += '<span class="cur-pv">' + esc(m.tool_result.split('\n')[0].slice(0,50)) + '</span>';
      }
      h += '<span class="cur-ch">▸</span>';
      h += '</div>';

      // body (hidden by default)
      h += '<div id="' + uid + '" class="cur-body hidden">';
      if (isEdit && m.old_string) {
        h += '<div class="cur-diff"><div class="cur-diff-head">' + esc(fp) + '</div><div class="cur-diff-body">';
        for (const l of (m.old_string||'').split('\n')) h += '<div class="cur-dl cur-dd">- ' + esc(l) + '</div>';
        for (const l of (m.new_string||'').split('\n')) h += '<div class="cur-dl cur-da">+ ' + esc(l) + '</div>';
        h += '</div></div>';
      }
      if (isBash && m.tool_result) {
        h += '<div class="cur-bash"><div class="cur-bash-h"><span class="cur-bash-p">$</span><span class="cur-bash-c">' + esc(m.command) + '</span></div>';
        h += '<div class="cur-bash-o">' + esc(m.tool_result) + '</div></div>';
      }
      h += '</div>';
    }
    h += '</div></div></div>';
  }
  return h;
}

// ══════════════════════════════════════
// 方案 C: 智能分区
// ══════════════════════════════════════
function renderSchemeC(data) {
  // 1. Group consecutive assistant msgs into "turns" split by text messages
  // A turn = optional text + following tool calls until next text
  const turns = [];
  let cur = { texts: [], tools: [] };

  for (const m of data) {
    if (m.role !== 'assistant') continue;
    if (m.type === 'text' && m.text) {
      // If we have accumulated tools, flush as a turn
      if (cur.tools.length > 0) {
        turns.push({ ...cur });
        cur = { texts: [], tools: [] };
      }
      cur.texts.push(m.text);
    } else if (m.type === 'tool_use') {
      cur.tools.push(m);
    }
  }
  if (cur.texts.length || cur.tools.length) turns.push(cur);

  let h = '';
  for (const turn of turns) {
    h += '<div class="msg-row"><div class="avatar">C</div><div class="wrap"><div class="c-bub">';

    // Render texts first
    for (const t of turn.texts) {
      h += '<div class="c-text">' + inlineCode(esc(t)) + '</div>';
    }

    // Classify tools
    const reads = [];
    const writes = [];
    const bashes = [];
    const others = [];

    for (const t of turn.tools) {
      const tn = t.tool_name || '';
      if (READONLY.has(tn)) reads.push(t);
      else if (WRITE_TOOLS.has(tn)) writes.push(t);
      else if (tn === 'Bash') bashes.push(t);
      else others.push(t);
    }

    // ── Only-read tools → pill row ──
    if (reads.length > 0) {
      h += '<div class="c-read-row">';
      // Group by type for label
      const readFiles = reads.filter(r => r.tool_name === 'Read');
      const greps = reads.filter(r => r.tool_name === 'Grep');
      const globs = reads.filter(r => r.tool_name === 'Glob');
      const otherReads = reads.filter(r => !['Read','Grep','Glob'].includes(r.tool_name||''));

      if (readFiles.length > 0) {
        h += '<span class="c-read-label">读取</span>';
        for (const r of readFiles) {
          h += '<span class="c-pill"><span class="c-pill-icon">📄</span>' + esc(fn(r.file_path)) + '</span>';
        }
      }
      if (greps.length > 0) {
        h += '<span class="c-read-label" style="margin-left:4px">搜索</span>';
        for (const r of greps) {
          h += '<span class="c-pill c-pill-grep"><span class="c-pill-icon">🔍</span>"' + esc((r.pattern||'').slice(0,30)) + '"</span>';
        }
      }
      if (globs.length > 0) {
        for (const r of globs) {
          h += '<span class="c-pill"><span class="c-pill-icon">📂</span>' + esc((r.pattern||'').slice(0,30)) + '</span>';
        }
      }
      for (const r of otherReads) {
        h += '<span class="c-pill"><span class="c-pill-icon">' + ic(r.tool_name) + '</span>' + esc(r.tool_name) + '</span>';
      }
      h += '</div>';
    }

    // ── Write tools → inline diff ──
    for (const w of writes) {
      h += '<div class="c-edit">';
      h += '<div class="c-edit-head">';
      h += '<span class="c-edit-icon">✏️</span>';
      h += '<span class="c-edit-file">' + esc(fn(w.file_path)) + '</span>';
      if (w.old_string || w.new_string) {
        h += '<span class="c-edit-stat">' + editStat(w.old_string, w.new_string) + '</span>';
      }
      h += '</div>';
      if (w.old_string || w.new_string) {
        h += '<div class="c-edit-diff">';
        for (const l of (w.old_string||'').split('\n')) {
          if (l.trim()) h += '<div class="c-dl c-dd">- ' + esc(l) + '</div>';
        }
        for (const l of (w.new_string||'').split('\n')) {
          if (l.trim()) h += '<div class="c-dl c-da">+ ' + esc(l) + '</div>';
        }
        h += '</div>';
      }
      h += '</div>';
    }

    // ── Bash → status line ──
    for (const b of bashes) {
      h += '<div class="c-bash">';
      h += '<span class="c-bash-icon">⚡</span>';
      h += '<span class="c-bash-cmd">' + esc((b.command||'').replace(/^cd [^ ]+ && /, '').slice(0,80)) + '</span>';
      // Determine pass/fail
      const result = (b.tool_result || '').trim();
      const hasError = b.tool_error || result.toLowerCase().includes('error');
      const noOutput = result === '' || result === '(Bash completed with no output)';
      if (hasError) {
        h += '<span class="c-bash-ok c-bash-fail">fail</span>';
      } else {
        h += '<span class="c-bash-ok c-bash-pass">✓ pass</span>';
      }
      h += '</div>';
      // Show result if it has meaningful content (errors or short output)
      if (result && !noOutput) {
        h += '<div class="c-bash-result">' + esc(result.slice(0,150)) + '</div>';
      }
    }

    // ── Other tools ──
    for (const o of others) {
      h += '<div class="c-other">';
      h += '<span class="c-other-icon">' + ic(o.tool_name) + '</span>';
      h += '<span class="c-other-name">' + esc(o.tool_name) + '</span>';
      h += '</div>';
    }

    h += '</div></div></div>';

    // Small gap between turns
    h += '<div class="turn-gap"></div>';
  }
  return h;
}

// ── Render both columns ──
document.getElementById('col-cur').innerHTML = renderCurrent(DEMO_DATA);
document.getElementById('col-new').innerHTML = renderSchemeC(DEMO_DATA);
</script>
</body>
