[project]
name = "task-conductor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "websockets>=13,<15",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "psutil>=5.9",
    "argon2-cffi>=23.1",
    "apscheduler>=3.10",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
